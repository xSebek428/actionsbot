name: Build NovaBot

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: novabot-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Minecraft mod (Java 21)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Gradle 8.12
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.12"

      - name: Build NovaBot
        run: gradle --no-daemon clean build

      - name: Upload remapped mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: NovaBot-1.0.0
          path: build/libs/NovaBot-*.jar
          if-no-files-found: error
          retention-days: 14
